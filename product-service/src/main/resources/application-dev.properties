# Datasource Configuration - Development Environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Authadmin_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.schema_management_tool=flyway
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Kafka settings are NOT set here on purpose. ECS injects:
#   APP_EVENTS_PUBLISHER=logging|kafka
#   SPRING_KAFKA_BOOTSTRAP_SERVERS=PRIVATE_IP:9092

# Messaging: logging (default, safe on AWS) | kafka
# Environment variable APP_EVENTS_PUBLISHER overrides this on ECS.
app.events.publisher=logging

# Kafka producer: fail fast (5s) instead of hanging the request for 60s if the broker is down
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000


# Logging Configuration
logging.level.root=WARN
logging.level.com.ecommerce.authservice=INFO
logging.level.org.flywaydb=INFO

# JWT Configuration - Development
jwt.secret=${JWT_SECRET:dev-secret-key}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Product Service - Development
app.version=1.0.0-dev
