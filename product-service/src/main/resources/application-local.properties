# Local Development Profile

# Server Configuration
server.port=8082
server.servlet.context-path=/api

# Datasource Configuration - Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/product_db_local
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Local Kafka (docker compose). Set to "logging" to run without Kafka.
spring.kafka.bootstrap-servers=localhost:9092
app.events.publisher=kafka

# Logging Configuration
logging.level.root=INFO
logging.level.com.ecommerce.productservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration - Local Testing
jwt.secret=local-secret-key-not-for-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Product Service - Local
app.version=1.0.0-local
