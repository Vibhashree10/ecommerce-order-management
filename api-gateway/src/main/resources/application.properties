spring.application.name=api-gateway
spring.profiles.active=local

server.port=8080

# The gateway's own health endpoint lives at /api/actuator/health, like every other service
# (management base-path, NOT spring.webflux.base-path, which would also move the proxied routes).
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false
management.endpoint.health.show-details=never

# JWT: the SAME secret auth-service signs with. Provide it as JWT_SECRET (never commit it).
gateway.jwt.secret=${JWT_SECRET:}

# Per-route settings (environment variables in brackets). Paths are fixed in code.
#   gateway.routes.auth.url          [GATEWAY_ROUTES_AUTH_URL]          http://host:8081
#   gateway.routes.product.url       [GATEWAY_ROUTES_PRODUCT_URL]
#   gateway.routes.product.authenticated=false   [GATEWAY_ROUTES_PRODUCT_AUTHENTICATED]  make product browsing public
#   gateway.routes.order.url / .key  [GATEWAY_ROUTES_ORDER_URL / _KEY]
#   gateway.routes.notification.enabled=true / url / key
#   gateway.routes.inventory.enabled=true / url / key   (internal service: off by default)
gateway.routes.auth.url=${GATEWAY_ROUTES_AUTH_URL:}
gateway.routes.product.url=${GATEWAY_ROUTES_PRODUCT_URL:}
gateway.routes.order.url=${GATEWAY_ROUTES_ORDER_URL:}
gateway.routes.notification.url=${GATEWAY_ROUTES_NOTIFICATION_URL:}
gateway.routes.inventory.url=${GATEWAY_ROUTES_INVENTORY_URL:}

# A slow service must not hold gateway connections forever.
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=15s

# CORS for browser front ends. Comma separated origins, for example https://shop.example.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

logging.level.org.springframework.cloud.gateway=INFO
