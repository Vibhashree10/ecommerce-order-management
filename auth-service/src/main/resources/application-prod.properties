# Production Profile
spring.profiles.active=prod

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Datasource Configuration - Production Environment
spring.datasource.url=jdbc:postgresql://${DB_HOST:db-prod}:${DB_PORT:5432}/${DB_NAME:auth_db_prod}
spring.datasource.username=${DB_USER:prod_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Logging Configuration
logging.level.root=ERROR
logging.level.com.ecommerce.authservice=WARN

# JWT Configuration - Production
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Auth Service - Production
app.version=1.0.0
