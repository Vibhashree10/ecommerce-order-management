# Datasource Configuration - Development Environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Authadmin_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.schema_management_tool=flyway
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true


# Logging Configuration
logging.level.root=WARN
logging.level.com.ecommerce.authservice=INFO
logging.level.org.flywaydb=INFO

# JWT Configuration - Development
jwt.secret=${JWT_SECRET:dev-secret-key}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Auth Service - Development
app.version=1.0.0-dev
