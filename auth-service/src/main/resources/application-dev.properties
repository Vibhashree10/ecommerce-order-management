# Development Profile
spring.profiles.active=dev

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Datasource Configuration - Development Environment
spring.datasource.url=jdbc:postgresql://db-dev:5432/auth_db_dev
spring.datasource.username=dev_user
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Logging Configuration
logging.level.root=WARN
logging.level.com.ecommerce.authservice=INFO

# JWT Configuration - Development
jwt.secret=${JWT_SECRET:dev-secret-key}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Auth Service - Development
app.version=1.0.0-dev
