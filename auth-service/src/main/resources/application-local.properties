# Local Development Profile

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Datasource Configuration - Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db_local
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.ecommerce.authservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration - Local Testing
jwt.secret=local-secret-key-not-for-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Auth Service - Local
app.version=1.0.0-local
