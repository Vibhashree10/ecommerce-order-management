# Spring Application Configuration for Testing
spring.application.name=auth-service-test
spring.profiles.active=test

# Datasource Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true

# Flyway Configuration
spring.flyway.enabled=false

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# JWT Configuration - Test
jwt.secret=test-secret-key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=Auth Service - Test
app.version=1.0.0-test

# Logging Configuration
logging.level.root=INFO
logging.level.com.ecommerce.authservice=DEBUG
logging.level.org.springframework.test=DEBUG
