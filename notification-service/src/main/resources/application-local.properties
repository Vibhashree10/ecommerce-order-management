# Local development only. Set LOCAL_DB_USER / LOCAL_DB_PASSWORD (or edit the defaults below)
# to match YOUR local Postgres login - the same one you use in pgAdmin.
# Create the empty database once in pgAdmin (right-click Databases > Create > notification_database)
# or:  CREATE DATABASE notification_database;
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/notification_database}
spring.datasource.username=${LOCAL_DB_USER:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Set to true only if you started a Kafka broker on localhost:9092 and order-service publishes with app.events.publisher=kafka
notifications.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

logging.level.com.ecommerce.notification_service=DEBUG
