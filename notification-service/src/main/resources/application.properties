spring.application.name=notification-service
# Default profile for local runs. ECS overrides it with SPRING_PROFILES_ACTIVE=dev.
# NEVER put spring.profiles.active inside application-local/dev/prod.properties.
spring.profiles.active=local

server.port=8085
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Flyway creates the tables; Hibernate only validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
# An unreachable SMTP server must never turn /actuator/health DOWN (the load balancer would then kill the task)
management.health.mail.enabled=false

# ---------------------------------------------------------------------------
# Kafka CONSUMER (order events). Off by default: without a broker the service still works through
# POST /notifications/events. On AWS the deploy script sets NOTIFICATIONS_KAFKA_ENABLED=true and
# SPRING_KAFKA_BOOTSTRAP_SERVERS=PRIVATE_IP:9092.
# ---------------------------------------------------------------------------
notifications.kafka.enabled=false
notifications.kafka.topics=order-created,order-confirmed,order-cancelled,order-rejected
spring.kafka.consumer.group-id=notification-service
# a new consumer group reads from the beginning, so events published before the first start are not lost
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# topics are created by the first producer; do not fail startup if one does not exist yet
spring.kafka.listener.missing-topics-fatal=false

# ---------------------------------------------------------------------------
# Channels. LOG is always on (it writes the notification to the log and the database).
# EMAIL is optional. Settings come from env vars on AWS:
#   NOTIFICATIONS_EMAIL_ENABLED=true  NOTIFICATIONS_EMAIL_FROM=...  NOTIFICATIONS_EMAIL_DEFAULT_RECIPIENT=...
#   SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD  (Amazon SES SMTP works)
# spring.mail.host is deliberately NOT set here.
# ---------------------------------------------------------------------------
notifications.email.enabled=false
notifications.email.from=
# used when an event carries no customerEmail (orders do not carry one yet)
notifications.email.default-recipient=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Retry of failed sends (e.g. SMTP down)
notifications.retry-enabled=true
notifications.retry-scan-ms=60000
notifications.retry-after-seconds=60
notifications.max-attempts=3

# ---------------------------------------------------------------------------
# Inbound protection (Phase 1). Blank = open (local dev only). On AWS set env var SECURITY_INTERNAL_API_KEY.
# ---------------------------------------------------------------------------
security.internal-api-key=
