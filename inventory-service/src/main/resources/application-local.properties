# Local development only. Adjust credentials to your local Postgres.
# Create the database once:
#   docker exec -it ecommerce-postgres psql -U admin -d postgres -c "CREATE DATABASE inventory_database;"
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db_local
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Local Kafka (docker compose). Set to "logging" to run without Kafka.
app.events.publisher=kafka
spring.kafka.bootstrap-servers=localhost:9092

# >>> INTER-SERVICE CALL: set to true when product-service runs locally on 8082
clients.product-service.enabled=false

logging.level.com.ecommerce.inventory_service=DEBUG
