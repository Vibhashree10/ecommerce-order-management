# AWS (ECS) profile. Every value comes from environment variables set in the task definition.
# The names must match exactly what deploy-service.sh injects.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Several services share one small RDS instance, so keep pools small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Injected by ECS (NOT set here on purpose):
#   APP_EVENTS_PUBLISHER=logging|kafka
#   SPRING_KAFKA_BOOTSTRAP_SERVERS=PRIVATE_IP:9092
#   SECURITY_INTERNAL_API_KEY=...                      (protects THIS service)
#   CLIENTS_INVENTORY_SERVICE_ENABLED=true
#   CLIENTS_INVENTORY_SERVICE_BASE_URL=http://<inventory-alb-dns>/api
#   CLIENTS_INVENTORY_SERVICE_API_KEY=...              (the key INVENTORY-service requires)
#   CLIENTS_PRODUCT_SERVICE_ENABLED=true|false
#   CLIENTS_PRODUCT_SERVICE_BASE_URL=http://<product-alb-dns>/api

# INFO (not WARN) so Flyway and startup problems are visible in CloudWatch
logging.level.root=INFO
logging.level.org.flywaydb=INFO
logging.level.com.ecommerce.order_service=INFO
