spring.application.name=order-service
# Default profile for local runs. ECS overrides it with SPRING_PROFILES_ACTIVE=dev.
# NEVER put spring.profiles.active inside application-local/dev/prod.properties.
spring.profiles.active=local

server.port=8084
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Flyway creates the tables; Hibernate only validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# Messaging: logging (default, safe on AWS) | kafka
# Environment variable APP_EVENTS_PUBLISHER overrides this on ECS.
# ---------------------------------------------------------------------------
app.events.publisher=logging
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast (5s) instead of hanging the request for 60s if the broker is down
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# ---------------------------------------------------------------------------
# Order rules
# ---------------------------------------------------------------------------
orders.default-currency=USD
orders.max-items-per-order=50

# Background recovery jobs (see OrderRecoveryJob)
orders.jobs-enabled=true
orders.jobs-scan-ms=60000
# PENDING order (stock reservation not completed, e.g. inventory was unreachable): retry after this long ...
orders.pending-retry-after-seconds=60
# ... and give up (cancel) after this long. Inventory releases any half-made reservation by itself after its TTL.
orders.pending-max-age-minutes=10
# STOCK_RESERVED order older than this is checked against inventory (inventory TTL is 15 min, plus 1 min grace)
orders.reservation-sync-after-minutes=16

# ---------------------------------------------------------------------------
# >>> INTER-SERVICE CALL: Order -> Inventory (reserve / confirm / release / get)
# On AWS the deploy script sets (env vars):
#   CLIENTS_INVENTORY_SERVICE_BASE_URL=http://<inventory-alb-dns>/api
#   CLIENTS_INVENTORY_SERVICE_API_KEY=<the key inventory-service requires>
# enabled=false is a STUB for running order-service alone. It fakes reservations, so never use it on AWS.
# ---------------------------------------------------------------------------
clients.inventory-service.enabled=true
clients.inventory-service.base-url=http://localhost:8083/api
clients.inventory-service.api-key=
clients.inventory-service.connect-timeout-ms=2000
clients.inventory-service.read-timeout-ms=5000

# ---------------------------------------------------------------------------
# >>> INTER-SERVICE CALL: Order -> Product (price + name snapshot, product must be active)
# Disabled by default: then every order line must carry "unitPrice". Enable on AWS with
#   CLIENTS_PRODUCT_SERVICE_ENABLED=true
#   CLIENTS_PRODUCT_SERVICE_BASE_URL=http://<product-alb-dns>/api
# Verify product-service really exposes GET <base-url><product-path> before enabling!
# ---------------------------------------------------------------------------
clients.product-service.enabled=false
clients.product-service.base-url=http://localhost:8082/api
clients.product-service.product-path=/products/{id}
clients.product-service.connect-timeout-ms=2000
clients.product-service.read-timeout-ms=3000

# Business errors (409 / 404 from inventory) must NOT count as failures and open the circuit.
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryService.ignore-exceptions=com.ecommerce.order_service.exception.StockUnavailableException,com.ecommerce.order_service.exception.ReservationNotFoundException,com.ecommerce.order_service.exception.ReservationStateException

resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

# ---------------------------------------------------------------------------
# Inbound service-to-service protection (Phase 1). Blank = open (local dev only).
# On AWS set env var SECURITY_INTERNAL_API_KEY. Callers send header X-Internal-Api-Key.
# ---------------------------------------------------------------------------
security.internal-api-key=
