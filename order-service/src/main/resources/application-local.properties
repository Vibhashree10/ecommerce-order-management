# Local development only. Set LOCAL_DB_USER / LOCAL_DB_PASSWORD (or edit the defaults below)
# to match YOUR local Postgres login - the same one you use in pgAdmin.
# Create the empty database once in pgAdmin (right-click Databases > Create > order_database)
# or:  CREATE DATABASE order_database;
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db_local
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Local Kafka is optional. Keep "logging" unless you started a broker.
app.events.publisher=logging
spring.kafka.bootstrap-servers=localhost:9092

# >>> INTER-SERVICE CALLS
# Order -> Inventory: start inventory-service locally (port 8083) first, or set enabled=false to use the STUB.
clients.inventory-service.enabled=true
clients.inventory-service.base-url=http://localhost:8083/api
# Local inventory has a blank API key, so leave this blank too (a key is only needed on AWS).
clients.inventory-service.api-key=
# Order -> Product: when false, every order line must contain "unitPrice".
clients.product-service.enabled=false
clients.product-service.base-url=http://localhost:8082/api

logging.level.com.ecommerce.order_service=DEBUG
